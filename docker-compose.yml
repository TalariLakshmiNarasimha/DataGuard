# Docker Compose - Local PostgreSQL for DataGuard
# Usage: docker-compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: dataguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dataguard
      POSTGRES_USER: dataguard
      POSTGRES_PASSWORD: dataguard_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataguard -d dataguard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
